services:
  # Frontend (static build served by nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "${PORT_FRONTEND}:80"
    depends_on:
      - gateway
    restart: unless-stopped

  # API Gateway
  gateway:
    image: nginx:alpine
    volumes:
      - ./backend/gateway/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${PORT_GATEWAY}:80"
    depends_on:
      - auth-service
      - auction-service
      - bidding-service
    restart: unless-stopped

  # Database (port NOT exposed publicly in production)
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p${DB_ROOT_PASSWORD} --silent" ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Microservices
  auth-service:
    build:
      context: ./backend/auth-service
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASSWORD}
      - DB_NAME=${DB_DATABASE}
      - PORT=${PORT_AUTH_SERVICE}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  auction-service:
    build:
      context: ./backend/auction-service
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASSWORD}
      - DB_NAME=${DB_DATABASE}
      - PORT=${PORT_AUCTION_SERVICE}
      - SERVICE_PREFIX=/auction
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  bidding-service:
    build:
      context: ./backend/bidding-service
    environment:
      - PORT=${PORT_BIDDING_SERVICE}
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASSWORD}
      - DB_NAME=${DB_DATABASE}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
  uploads_data:
