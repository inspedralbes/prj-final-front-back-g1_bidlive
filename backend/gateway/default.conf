server {
  listen 80;
  server_name _;
  client_max_body_size 10M;

  # Allow up to 10MB uploads (avatars, auction images)

  # --- CORS GLOBAL ---
  add_header Access-Control-Allow-Origin "http://localhost:5173" always;
  add_header Access-Control-Allow-Credentials "true" always;
  add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
  add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;

  # Responder rápido a peticiones OPTIONS (Preflight)
  if ($request_method = OPTIONS) {
    return 204;
  }

  # AUTH SERVICE
  location /auth/ {
    proxy_pass http://auth-service:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Important for file uploads: don't buffer the request body
    proxy_request_buffering off;
  }

  # AUCTION SERVICE
  location /auction/ {
    proxy_pass http://auction-service:3001/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
  }

  # BIDDING & SOCKETS
  location /bidding/ {
    proxy_pass http://bidding-service:3002/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 10s;
    keepalive_timeout 3600s;
  }

  location /socket.io/ {
    proxy_pass http://bidding-service:3002/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
  }
}