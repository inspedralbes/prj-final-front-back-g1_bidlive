server {
  listen 80;
  server_name _;

  # --- CORS GLOBAL ---
  add_header Access-Control-Allow-Origin "http://localhost:5173" always;
  add_header Access-Control-Allow-Credentials "true" always;
  add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
  add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;

  # Responder rápido a peticiones OPTIONS (Preflight)
  if ($request_method = OPTIONS) {
    return 204;
  }

  # AUTH SERVICE
  location /auth/ {
    proxy_pass http://auth-service:3000/; # El '/' final elimina el prefijo /auth/
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # AUCTION SERVICE
  location /auction/ {
    proxy_pass http://auction-service:3001/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # BIDDING & SOCKETS
  location /bidding/ {
    proxy_pass http://bidding-service:3002/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
  }

  location /socket.io/ {
    proxy_pass http://bidding-service:3002/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
  }
}