server {
  listen 80;
  server_name _;

  # Usar el DNS interno de Docker para resolución dinámica de hostnames
  resolver 127.0.0.11 valid=30s ipv6=off;

  # Tamaño máximo de upload (para imágenes de pujas)
  client_max_body_size 20M;

  # --- CORS GLOBAL ---
  add_header Access-Control-Allow-Origin "http://localhost:5173" always;
  add_header Access-Control-Allow-Credentials "true" always;
  add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
  add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;

  # Responder rápido a peticiones OPTIONS (Preflight)
  if ($request_method = OPTIONS) {
    return 204;
  }

  # AUTH SERVICE: /auth/* → auth-service:3000/*
  location /auth/ {
    set $auth_upstream http://auth-service:3000;
    rewrite ^/auth/(.*) /$1 break;
    proxy_pass $auth_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # AUCTION SERVICE: /auction/* → auction-service:3001/*
  location /auction/ {
    set $auction_upstream http://auction-service:3001;
    rewrite ^/auction/(.*) /$1 break;
    proxy_pass $auction_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # BIDDING SERVICE (WebSocket): /bidding/* → bidding-service:3002/*
  location /bidding/ {
    set $bidding_upstream http://bidding-service:3002;
    rewrite ^/bidding/(.*) /$1 break;
    proxy_pass $bidding_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
  }
}