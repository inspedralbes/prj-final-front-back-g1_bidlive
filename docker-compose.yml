version: '3.8'

services:
  # Frontend
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - gateway

  # API Gateway
  gateway:
    image: nginx:alpine
    volumes:
      - ./backend/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - auth-service
      - auction-service
      - bidding-service

  # Database
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bidlive
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # Microservices
  auth-service:
    build:
      context: ./backend/auth-service
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=rootpassword
      - DB_NAME=bidlive
      - PORT=3000
    depends_on:
      - db

  auction-service:
    build:
      context: ./backend/auction-service
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=rootpassword
      - DB_NAME=bidlive
      - PORT=3001
    depends_on:
      - db

  bidding-service:
    build:
      context: ./backend/bidding-service
    environment:
      - PORT=3002
    depends_on:
      - db

volumes:
  db_data:
