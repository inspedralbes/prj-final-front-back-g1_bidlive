services:
  # Frontend
  frontend:
    build:
      context: ./frontend
    ports:
      - "${PORT_FRONTEND}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - gateway

  # API Gateway
  gateway:
    image: nginx:alpine
    volumes:
      - ./backend/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${PORT_GATEWAY}:80"
    depends_on:
      - auth-service
      - auction-service
      - bidding-service

  # Database
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    ports:
      - "${PORT_DB}:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "${PORT_PHPMYADMIN}:80"
    depends_on:
      - db

  # Microservices
  auth-service:
    build:
      context: ./backend/auth-service
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASSWORD}
      - DB_NAME=${DB_DATABASE}
      - PORT=${PORT_AUTH_SERVICE}
    volumes:
      - ./backend/auth-service:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - db

  auction-service:
    build:
      context: ./backend/auction-service
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASSWORD}
      - DB_NAME=${DB_DATABASE}
      - PORT=${PORT_AUCTION_SERVICE}
      - SERVICE_PREFIX=/auction
    volumes:
      - ./backend/auction-service:/app
      - /app/node_modules
      - ./backend/auction-service/uploads:/app/uploads # Persist uploads
    command: npm run dev
    depends_on:
      - db

  bidding-service:
    build:
      context: ./backend/bidding-service
    environment:
      - PORT=${PORT_BIDDING_SERVICE}
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASSWORD}
      - DB_NAME=${DB_DATABASE}
    volumes:
      - ./backend/bidding-service:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - db

volumes:
  db_data:
